<style>
@font-face {
  src: local('Consolas');
  font-family: 'Mono';
  size-adjust: 94.6%;
  font-display: swap;
}
@font-face {
  src: local('JetBrains Mono'), local('Fira Code'), local('Menlo'),
       local('DejaVu Sans Mono'), local('Liberation Mono'), local('Courier New');
  font-family: 'Mono';
  font-display: swap;
