name: Update README

on:
  push:
    branches: [main]
    paths:
      - "data.json"
      - "logo.txt"
      - "tools/**"
      - ".github/workflows/update.yml"
  schedule:
    # todo dia as 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python tools/update.py

      - name: Render SVG
        run: python tools/render.py --data data.json --style cli --theme both --outdir .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json dark_mode.svg light_mode.svg cache/
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualiza dados do README [skip ci]"
            git push
          fi
