<style>
@font-face {
  src: local('Consolas');
  font-family: 'Mono';
  size-adjust: 94.6%;
  font-display: swap;
}
@font-face {
  src: local('JetBrains Mono'), local('Fira Code'), local('Menlo'),
       local('DejaVu Sans Mono'), local('Liberation Mono'), local('Courier New');
  font-family: 'Mono';
  font-display: swap;
}
text, tspan { white-space: pre; }

/* Cursor piscando, como um terminal esperando comando. O CSS dentro de um
   SVG referenciado como imagem roda no GitHub, e o prefers-reduced-motion
   desliga pra quem pediu. */
.cursor { animation: blink 1.15s steps(1, end) infinite; }
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cursor { animation: none; opacity: 1; }
}

</style>

